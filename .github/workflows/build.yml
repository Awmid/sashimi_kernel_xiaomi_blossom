name: Build Sashimi Kernel

on:
  push:
    branches:
      - sashimi
    paths-ignore:
      - 'README*'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  KERNEL_DEFCONFIG: blossom_defconfig
  KERNEL_ARCH: arm64
  KBUILD_BUILD_USER: github-actions
  KBUILD_BUILD_HOST: ci-server
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r383902.tar.gz
  ANYKERNEL_REPO_URL: https://github.com/Awmid/anykernel3.git

jobs:
  build:
    name: Build and package Sashimi
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev cpio kmod git zip curl ca-certificates zstd xz-utils lld ccache gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Cache Android Clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: /tmp/clang
          key: android-clang-r383902

      - name: Download Android Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/clang
          curl -fL --retry 3 "$CLANG_URL" -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C /tmp/clang
          rm /tmp/clang.tar.gz

      - name: Add Clang to PATH
        run: echo /tmp/clang/bin >> "$GITHUB_PATH"

      - name: Configure compiler cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-sashimi-ccache-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-sashimi-ccache-

      - name: Build kernel
        run: |
          set -euo pipefail
          clang --version
          export ARCH="$KERNEL_ARCH"
          export SUBARCH="$KERNEL_ARCH"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CCACHE_DIR=/home/runner/.ccache
          export CCACHE_MAXSIZE=3G
          export CCACHE_COMPILERCHECK=content
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime

          MAKE_ARGS=(O=out ARCH="$ARCH" CC="ccache clang" HOSTCC=clang HOSTCXX=clang++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump OBJSIZE=llvm-size READELF=llvm-readelf STRIP=llvm-strip CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32")
          make "${MAKE_ARGS[@]}" "$KERNEL_DEFCONFIG"
          make -j"$(nproc)" "${MAKE_ARGS[@]}" Image.gz-dtb 2>&1 | tee build.log

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 "$ANYKERNEL_REPO_URL" anykernel3
          cp out/arch/arm64/boot/Image.gz-dtb anykernel3/Image.gz-dtb
          ZIP_NAME="Sashimi-Kernel-${GITHUB_SHA}.zip"
          (cd anykernel3 && zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" * -x .git README.md '*placeholder')
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload kernel package
        uses: actions/upload-artifact@v4
        with:
          name: Sashimi-Kernel
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
