name: Build Sashimi Kernel (baseline,non KSU)

on:
  push:
    branches:
      - sashimi
    paths-ignore:
      - 'README*'
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or FULL commit SHA to build (blank = the branch you ran this on)"
        required: false
        default: ""

env:
  KERNEL_DEFCONFIG: "blossom_defconfig"
  KERNEL_ARCH: "arm64"
  KBUILD_BUILD_USER: "github-actions"
  KBUILD_BUILD_HOST: "ci-server"
  # Official LLVM release from GitHub (verified to exist: LLVM-23.1.0-Linux-X64.tar.xz).
  # 23.1.0 matches the Sashimi dev's reference builds.
  LLVM_VERSION: "23.1.4"
  # Set to "true" only if the build dies on -Werror in vendor drivers.
  STRIP_WERROR: "false"
  BAKASU_COMMIT: "main"


jobs:
  build_and_package:
    name: Build Kernel & Package AnyKernel3
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Keep shallow, the Sashimi repo has 800k+ commits.
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev cpio kmod git zip unzip curl \
            ca-certificates xz-utils ccache libxml2 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Configure Compiler Cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-sashimi-ccache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-sashimi-ccache-

      - name: Cache LLVM toolchain
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: /tmp/llvm
          key: llvm-github-${{ env.LLVM_VERSION }}-x86_64

      - name: Download LLVM toolchain
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          mkdir -p /tmp/llvm
          curl -fL --retry 3 -o /tmp/llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          tar -C /tmp/llvm -xf /tmp/llvm.tar.xz
          rm -f /tmp/llvm.tar.xz

      - name: Add LLVM to PATH
        run: |
          BIN="$(find /tmp/llvm -maxdepth 3 -path '*/bin/clang' | head -1 | xargs -r dirname)"
          if [ -z "$BIN" ]; then
            echo "::error::clang not found under /tmp/llvm"
            find /tmp/llvm -maxdepth 2
            exit 1
          fi
          echo "Toolchain bin dir: $BIN"
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          clang --version
          ld.lld --version
          llvm-ar --version | head -1
          aarch64-linux-gnu-gcc --version | head -1
          arm-linux-gnueabi-gcc --version | head -1

      - name: Check defconfig exists
        run: |
          if [ ! -f "arch/${KERNEL_ARCH}/configs/${KERNEL_DEFCONFIG}" ]; then
            echo "::error::${KERNEL_DEFCONFIG} not found. Available configs:"
            ls arch/${KERNEL_ARCH}/configs | head -80
            exit 1
          fi

      - name: Integrate BakaSu (pinned)
        run: |
          set -eo pipefail
          curl -fLSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKASU_COMMIT}/kernel/setup.sh" | bash -s "${BAKASU_COMMIT}"                  
          
      - name: integrate susfs
        run: |
          set -eo pipefail
        
          echo "================================================="
          echo "📥 Fetching SuSFS 4.19 Patch..."
          echo "================================================="
          curl -fLss "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Patch/susfs_patch_to_4.19.patch" -o /tmp/susfs_patch_to_4.19.patch
          curl -fLss "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/susfs_inline_hook_patches.sh" -o /tmp/susfs_inline_hook_patches.sh
          echo "================================================="
          echo "🛠️  Dynamically Patching Kernel..."
          echo "================================================="
          patch -p1 --fuzz=3 < /tmp/susfs_patch_to_4.19.patch
          echo "================================================="
          echo "🔧 Auto-Repairing Hunk #6 Mismatch (fs/namespace.c)..."
          echo "================================================="
          # We target alloc_vfsmnt inside vfs_kern_mount directly and inline patch it to resolve the failure
          if grep -q "mnt = alloc_vfsmnt(name);" fs/namespace.c; then
              sed -i 's/mnt = alloc_vfsmnt(name);/#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\tif (static_branch_unlikely(\&susfs_is_sdcard_android_data_not_decrypted)) {\n\t\tif (susfs_is_current_ksu_domain()) {\n\t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt(name ?:"none");\n\t\t\tgoto bypass_orig_flow;\n\t\t}\n\t}\n#endif\n\tmnt = alloc_vfsmnt(name);\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nbypass_orig_flow:\n#endif/g' fs/namespace.c
              echo "✅ Hunk #6 auto-repaired successfully!"
          else
              echo "❌ Critical fallback: alloc_vfsmnt signature not found in namespace.c"
              exit 1
          fi

          # Re-enable strict error capturing for script safety
          set -eo pipefail
          # Give execution permissions to the script and run it over your source tree
          chmod +x /tmp/susfs_inline_hook_patches.sh
          bash /tmp/susfs_inline_hook_patches.sh

        
          echo "================================================="
          echo "📝 Appending SuSFS Config Fragments..."
          echo "================================================="
          DEFCONFIG_PATH="arch/arm64/configs/blossom_defconfig"
        
          cat <<EOT >> "$DEFCONFIG_PATH"
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_USERFAULTFD=n
          CONFIG_KSU_SUSFS_SUS_KSTAT=n
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          EOT
        
          echo "✅ SuSFS patch and configurations successfully applied!"


      - name: Strip -Werror from vendor drivers
        if: env.STRIP_WERROR == 'true'
        shell: bash
        run: |
          find drivers -type f -not -type l \( -name 'Makefile*' -o -name 'Kbuild*' \) -print0 | while IFS= read -r -d '' file; do
            sed -i 's/-Werror[^ ]*//g' "$file" 2>/dev/null || true
          done

      - name: Build kernel
        run: |
          set -eo pipefail
          export ARCH=${KERNEL_ARCH}

          export CCACHE_DIR=/home/runner/.ccache
          export CCACHE_MAXSIZE=3G
          export CCACHE_COMPILERCHECK=content
          export CCACHE_NOHASHDIR=1
          export CCACHE_BASEDIR="$PWD"
          export CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime
          echo "=== CCACHE INITIAL STATS ==="
          ccache -s

          # Step 1: defconfig (no cross-compile flags, same as the dev's script)
          make O=out ARCH=${ARCH} CC=clang LD=ld.lld ${KERNEL_DEFCONFIG}

          # Step 2: build, matching the dev's toolchain script (clang + LLVM_IAS=1)
          BUILD_ARGS=(
            O=out
            ARCH=${ARCH}
            CROSS_COMPILE="aarch64-linux-gnu-"
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
            CROSS_COMPILE_COMPAT="arm-linux-gnueabi-"
            CC="ccache clang"
            LD=ld.lld
            NM=llvm-nm
            AR=llvm-ar
            STRIP=llvm-strip
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            READELF=llvm-readelf
            LLVM_IAS=1
            HOSTCC=clang
            HOSTCXX=clang++
            HOSTLD=ld.lld
            HOSTAR=llvm-ar
            KCFLAGS="-Wno-error"
          )
          ccache -z
          make -j"$(nproc)" "${BUILD_ARGS[@]}" Image.gz dtbs 2>&1 | tee build.log

          echo "=== CCACHE FINAL STATS ===" | tee -a build.log
          ccache -s | tee -a build.log

          echo "=== COMPILE INFO ===" | tee -a build.log
          cat out/include/generated/compile.h | tee -a build.log || true

      - name: Show first errors
        if: failure()
        run: |
          grep -nE "error:|Error [0-9]|undefined reference" build.log | head -40 || true

      - name: Package AnyKernel3
        run: |
          set -eo pipefail
          SHORT="$(git rev-parse --short=9 HEAD)"
          STAMP="$(date -u +%y%m%d-%H%M)"
          ZIP_NAME="sashimi-${STAMP}-${SHORT}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

          BOOT="$PWD/out/arch/${KERNEL_ARCH}/boot"

          git clone --depth=1 https://github.com/Awmid/anykernel3.git anykernel
          cd anykernel
          rm -f Image* zImage* dtb

          # Sanity: the template must actually be AnyKernel3
          for f in anykernel.sh tools/ak3-core.sh META-INF/com/google/android/update-binary; do
            [ -f "$f" ] || { echo "::error::anykernel repo is missing $f (is Awmid/anykernel pushed and public?)"; ls -la; exit 1; }
          done

          # Kernel image
          if [ -f "$BOOT/Image.gz" ]; then
            cp "$BOOT/Image.gz" Image.gz
          elif [ -f "$BOOT/Image" ]; then
            cp "$BOOT/Image" Image
          else
            echo "::error::No kernel image found"
            ls -lah "$BOOT"
            exit 1
          fi

          # Dev's zip ships no dtb: AnyKernel keeps the stock boot.img DTB
          zip -r9 "../${ZIP_NAME}" . -x '.git/*' '.github/*' 'README.md' '*placeholder' \
            'LICENSE' '.gitattributes' 'modules/*' 'patch/*' 'ramdisk/*'

          echo "=== ZIP CONTENTS ==="
          unzip -l "../${ZIP_NAME}"
          for f in anykernel.sh tools/ak3-core.sh Image.gz META-INF/com/google/android/update-binary; do
            unzip -l "../${ZIP_NAME}" | grep -q " $f$" || { echo "::error::$f missing from zip"; exit 1; }
          done
          if unzip -l "../${ZIP_NAME}" | grep -q " dtb$"; then
            echo "::error::dtb must not be in the zip"; exit 1
          fi

      - name: Upload AnyKernel package
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_NAME }}
          archive: false
          retention-days: 30

      - name: Upload build log and config
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.sha }}
          path: |
            build.log
            out/.config
          retention-days: 14
